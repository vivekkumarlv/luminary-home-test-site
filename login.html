<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Luminary Home</title>
  <link rel="canonical" href="https://luminaryhome.test/login.html">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    :root { --brand: #b8860b; --brand-dark: #8b6508; }
    body { font-family: 'Georgia', serif; background: #f8f4ee; }
    .navbar-brand { font-size: 1.4rem; font-weight: 700; color: var(--brand) !important; }
    .btn-brand { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn-brand:hover { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
    .auth-card { background: #fff; border-radius: 12px; padding: 40px; border: 1px solid #eee; max-width: 440px; }
    .brand-accent { color: var(--brand); }
  </style>

  <!-- Adobe Launch placeholder — swap URL per test environment -->
  <script src="//assets.adobedtm.com/launch-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX.min.js" async></script>
</head>
<body>

<script src="auth.js"></script>

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    'ad_storage': 'denied', 'analytics_storage': 'denied',
    'ad_user_data': 'denied', 'ad_personalization': 'denied', 'wait_for_update': 500
  });

  // Redirect already-logged-in users to dashboard
  if (LH.auth.isLoggedIn()) { window.location.replace('dashboard.html'); }

  dataLayer.push({
    event: 'page_meta',
    page_type: 'login',
    user: LH.auth.getPageUserObject()
  });

  dataLayer.push({ event: 'page_view', page_type: 'login', page_title: 'Sign In — Luminary Home' });
</script>

<!-- GTM -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-LMHOME1');</script>

<nav class="navbar navbar-light bg-white shadow-sm" id="main-nav">
  <div class="container">
    <a class="navbar-brand" href="index.html">LUMINARY HOME</a>
    <div class="d-flex align-items-center gap-2">
      <span class="text-muted small">New here?</span>
      <a href="signup.html" class="btn btn-sm btn-brand">Sign Up</a>
    </div>
  </div>
</nav>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-LMHOME1" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="auth-card mx-auto">
        <h1 class="h3 mb-1 text-center">Welcome back</h1>
        <p class="text-muted text-center mb-4 small">Sign in to your Luminary Home account</p>

        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="login-email">Email address</label>
            <input type="email" class="form-control" id="login-email" name="email"
                   placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="mb-4">
            <label class="form-label d-flex justify-content-between" for="login-password">
              Password
              <a href="#" class="small text-muted">Forgot password?</a>
            </label>
            <input type="password" class="form-control" id="login-password" name="password"
                   placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-brand w-100" id="login-submit-btn">Sign In</button>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted small mb-0">
          Don't have an account? <a href="signup.html" class="brand-accent">Create one</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function() {

  var form = document.getElementById('login-form');
  var errorBox = document.getElementById('login-error');
  var submitBtn = document.getElementById('login-submit-btn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorBox.classList.add('d-none');

    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;

    if (!email || !password) {
      errorBox.textContent = 'Please fill in all fields.';
      errorBox.classList.remove('d-none');
      return;
    }

    // Test-site auth: any email + password works; no server validation.
    var name = email.split('@')[0];
    var user = LH.auth.login(email, name);

    dataLayer.push({
      event: 'login',
      method: 'email',
      user_id: user.id_hashed
    });

    submitBtn.textContent = 'Signing in…';
    submitBtn.disabled = true;

    // Redirect to dashboard (or the page they came from)
    var redirect = new URLSearchParams(window.location.search).get('redirect') || 'dashboard.html';
    setTimeout(function () { window.location.href = redirect; }, 400);
  });

})();
</script>
</body>
</html>
